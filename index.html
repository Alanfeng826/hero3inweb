<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heroes III — Local Web (VCMI)</title>
  <script>
    // 强制使用本地打包版本，避免回落到远程 CDN
    try {
      localStorage.setItem("vcmi.client", "1.6.5-wasm-2");
    } catch (e) { }

    // 游戏语言：默认简体中文。
    // 切换方式 —— 在地址后加参数，例如：
    //   http://localhost:8099/?gamelang=english   切回英文
    //   http://localhost:8099/?gamelang=chinese   切回中文
    // 参数会被记住；改完需重新点一次“Start the game”才生效。
    try {
      var _gl = new URLSearchParams(location.search).get("gamelang");
      if (_gl) localStorage.setItem("vcmi.gamelang", _gl);
    } catch (e) { }
  </script>
  <!-- 服务器资源预载：自动把 Data/ 目录里的游戏资源装入启动器缓存，
       省去每次开始游戏前手动挑选 7 个文件。可用 ?autoload=0 关闭。
       Data/ 目录不存在时静默退出，不影响启动器自带的手动选文件流程。 -->
  <script defer src="autoload.js"></script>

  <!-- 触控板 / 触摸卷动适配：把 Mac 触控板双指滑动（wheel 事件）翻译成引擎认识的操作。
       注意：方向键和 Ctrl+方向键都会**移动英雄**，已实测无效，不要用。
       默认走「模拟光标贴边」，即 H3 原生的边缘滚动。
       模式可用 URL 参数切换：
         ?touchscroll=edge   默认，光标贴到地图视口边缘，触发原生边缘滚动
         ?touchscroll=drag   合成鼠标左键拖动，1:1 跟手，需开启「左键拖动地图」
         ?touchscroll=rdrag  合成鼠标右键拖动，1:1 跟手，需开启「右键拖动地图」
         ?touchscroll=0      关闭
       贴边位置可用 &el= &et= &er= &eb= 覆盖（相对画布的比例）。 -->
  <script defer src="touch-scroll.js"></script>

  <script type="module" crossorigin src="vcmi/launcher/vcmi-launcher.js"></script>
  <link rel="stylesheet" crossorigin href="vcmi/launcher/vcmi-launcher.css">
</head>

<body>
  <div id="save-toast" class="fixed bottom-4 right-4 bg-green-800 text-white px-6 py-3 
    rounded-lg shadow-lg transition-opacity opacity-0 duration-300 pointer-events-none hidden">
    Saving game progress...
  </div>
  <div id="app-container" class="flex flex-col">
    <div id="app"></div>
    <div id="keyboard-container" class="simple-keyboard"></div>
  </div>
  <img id="keyboard" src="keyboard.png">
</body>

</html>
